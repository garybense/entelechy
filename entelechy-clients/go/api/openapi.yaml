          nullable: true
          type: object
        usage:
          allOf:
          - $ref: "#/components/schemas/TokenUsage"
          description: Token usage metrics for LLM calls during reflection.
          nullable: true
        trace:
          allOf:
          - $ref: "#/components/schemas/ReflectTrace"
